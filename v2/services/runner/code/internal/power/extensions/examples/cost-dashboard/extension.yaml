# yaml-language-server: $schema=../extension.schema.json
#
# An example Lazybox extension (EXTENSIONS.md): what your agents cost, by
# model, workspace and conversation. It reads token use and the conversation
# list (titles only, never messages). It cannot act, send anything or reach
# the network.
lazybox: 1
name: Cost dashboard
version: 1.0.0
description: What your agents cost, by model, workspace and conversation.
author: Lazybox
panels:
  - id: costs
    title: Cost dashboard
    description: Spend and tokens across every workspace
    icon: chart
    entry: index.html
grants:
  - read:usage
  - read:sessions
