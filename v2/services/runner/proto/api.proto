message RepositoryCatalogEntry { string identity = 1; string name = 2; string repository_id = 3; }
message RepositoryCatalogSource { string id = 1; string state = 2; string detail = 3; int64 updated_at = 4; }
message RepositoryCatalog { repeated RepositoryCatalogEntry entries = 1; repeated RepositoryCatalogSource sources = 2; uint32 refresh_seconds = 3; }
message PrepareWorkspaceRequest {
  string request_key = 1; string collection_id = 2; string name = 3; repeated string repository_identities = 4;
  // The new workspace's branch, for every repository; empty keeps the Runner's default. Ignored when adding to a workspace.
  string branch = 5;
  // Adding to a workspace: the agent's request this answers. Once the
  // repositories are added, the request is resolved as added and the agent told.
  string repository_request_id = 6;
}
message WorkspacePreparation { string identity = 1; string message = 2; Collection collection = 3; }

message Snippet { string key = 1; string category = 2; string description = 3; string body = 4; string origin = 5; repeated string next = 6; }
message SnippetCatalog { repeated Snippet snippets = 1; }

// Processes the Runner hosts so they outlive it (see SESSION_HOSTS.md).
message ListProcessesRequest {}
message StopProcessRequest { string id = 1; }
message CleanUpOrphanProcessesRequest {}
message ProcessUsage {
  // Percent of one core, summed over the host and every process under it.
  double cpu_percent = 1;
  uint64 memory_bytes = 2;
  uint32 process_count = 3;
}
message HostedProcess {
  // The session host's id.
  string id = 1;
  // "agent", "command" or "terminal".
  string kind = 2;
  // "sessionhost" or "tmux": what started this process's host; "run" for a
  // `lazybox run` that went on in the background, which has no session host
  // (its id is "run:" and the command id).
  string backend = 3;
  // "running", "starting", "exited" or "unreachable".
  string state = 4;
  // This Runner holds the host. A host no Runner holds is an orphan.
  bool attached = 5;
  int32 host_pid = 6;
  int32 program_pid = 7;
  int64 uptime_seconds = 8;
  string label = 9;
  string workspace_id = 10;
  string workspace_name = 11;
  // The conversation attempt (session) an agent or command belongs to.
  string session_id = 12;
  string conversation_title = 13;
  string provider = 14;
  string command_id = 15;
  string terminal_id = 16;
  // Attaches a terminal to a tmux-hosted process's window; empty otherwise.
  string attach_command = 17;
  // Absent when the process table could not be read.
  ProcessUsage usage = 18;
  // TCP ports a command's processes listen on.
  repeated uint32 ports = 19;
}
message ProcessHosting {
  // The backend new processes use, and the Runner configuration's default.
  string selected = 1;
  string configured = 2;
  // tmux -V when tmux can host processes; otherwise why not.
  string tmux_version = 3;
  string tmux_problem = 4;
  // Why the last process meant for tmux runs in a session host instead.
  string fallback = 5;
}
message ProcessInventory {
  repeated HostedProcess processes = 1;
  ProcessHosting hosting = 2;
  // Hosts that could not be listed, for example an unreadable directory.
  string problem = 3;
}
message CleanUpOrphanProcessesResponse {
  uint32 stopped = 1;
  // Hosts the sweep left alone because it could not confirm their state.
  string problem = 2;
  ProcessInventory inventory = 3;
}

message OrchestrationProcessRequest {
  // Workspace whose repositories' committed .lazybox/process.yaml is read;
  // empty resolves the user's process file over the presets alone.
  string collection_id = 1;
  // The workspace repository (id or name) whose process file applies. Empty
  // applies the only one that has a file; with several, none applies and
  // notice says so.
  string repository = 2;
  // Tasks in the mission, which selects the default preset; 0 without one.
  uint32 tasks = 3;
}
message OrchestrationProcessLayer {
  // preset, user or repository.
  string kind = 1;
  string source = 2;
  // sha256 of the file as read: what a person approves before first use.
  string digest = 3;
}
message OrchestrationProcessIssue {
  // error or warning.
  string severity = 1;
  // Key path in the effective process, such as roles.worker.permission.
  string path = 2;
  string message = 3;
  // The layer and file that wrote the value, when known.
  string layer = 4;
  string source = 5;
  uint32 line = 6;
  uint32 column = 7;
}
message OrchestrationProcessCandidate {
  string repository_id = 1;
  string name = 2;
  string path = 3;
  string digest = 4;
}
message OrchestrationProcess {
  string preset = 1;
  bool valid = 2;
  // The effective process as a process file, and as JSON in the shape of the
  // published schema (process.v1.json). Empty when a layer cannot be parsed.
  string yaml = 3;
  string json = 4;
  // sha256 of the effective process: what a mission pins.
  string digest = 5;
  // Lowest first: preset, user, repository.
  repeated OrchestrationProcessLayer layers = 6;
  repeated OrchestrationProcessIssue issues = 7;
  // Workspace repositories that carry a process file.
  repeated OrchestrationProcessCandidate candidates = 8;
  // Why no repository file applies although some exist, or empty.
  string notice = 9;
  // The user's ceiling as JSON (the schema's Ceiling).
  string ceiling_json = 10;
  // Where the user's process file is read from (it may not exist).
  string user_file = 11;
}
message ExplainOrchestrationProcessRequest {
  OrchestrationProcessRequest process = 1;
  // An event type such as task.reported, or timer or stall.
  string event_type = 2;
}
message OrchestrationReaction {
  // rule, trigger or notification.
  string kind = 1;
  // Where it is in the process: rules[2], roles.coordinator.triggers[0].
  string path = 2;
  // CEL condition; empty fires always.
  string condition = 3;
  // The role it wakes or acts on, with that role's permission and scopes.
  string role = 4;
  string permission = 5;
  repeated string scopes = 6;
  // A person starts the role (manual trigger).
  bool manual = 7;
  // A rule's count limit per subject; 0 without one.
  uint32 limit = 8;
  // Where a notification goes.
  repeated string to = 9;
  // Event types it may cause.
  repeated string emits = 10;
  string summary = 11;
}
message OrchestrationProcessExplanation {
  string event_type = 1;
  // In firing order: rules, then role triggers, then notifications.
  repeated OrchestrationReaction reactions = 2;
  // The same, written for a person.
  string text = 3;
  // The effective process explained, and its problems.
  string digest = 4;
  bool valid = 5;
  repeated OrchestrationProcessIssue issues = 6;
}

// Inline review comments (see GITHUB.md, "Review comments").
message ReviewComment {
  string id = 1;
  string member = 2;
  // Relative to the member's worktree.
  string path = 3;
  // "new": the file as changed (added and unchanged lines); "old": lines the
  // change removed.
  string side = 4;
  // 1-based and inclusive, numbered as that side was when the comment was made.
  uint32 start_line = 5;
  uint32 end_line = 6;
  // The lines as the person saw them, and their content hash.
  repeated string snippet = 7;
  string hash = 8;
  // Markdown.
  string body = 9;
  // The member's commit when the comment was made, and the diff it was read
  // in: view is "uncommitted", "staged" or "branch"; base is what a branch
  // diff compared with (a branch, or the workspace's start commit).
  string head = 10;
  string view = 11;
  string base = 12;
  int64 created_at_unix = 13;
  int64 updated_at_unix = 14;
  // "open", "sent", "resolved" or "wont_fix".
  string disposition = 15;
  // The conversation it was put in for the agent, and the commit then.
  string sent_to = 16;
  string sent_to_title = 17;
  int64 sent_at_unix = 18;
  string sent_head = 19;
  // The commit that changed the lines when the Runner resolved it on its own,
  // and a sentence saying so.
  string resolved_by = 20;
  string note = 21;
  // Computed on every read against the working tree: "current", "moved"
  // (re-anchored to the same lines elsewhere), "outdated" or "unknown".
  string freshness = 22;
  uint32 current_start_line = 23;
  uint32 current_end_line = 24;
  string freshness_reason = 25;
}
message WorkspaceReview {
  repeated ReviewComment comments = 1;
  // Resolve a sent comment when a later commit changes its lines.
  bool auto_resolve = 2;
  // The comment an add created.
  string added_id = 3;
}
message ListReviewCommentsRequest { string collection_id = 1; }
message AddReviewCommentRequest {
  string collection_id = 1;
  string member = 2;
  string path = 3;
  string side = 4;
  uint32 start_line = 5;
  repeated string snippet = 6;
  string body = 7;
  string view = 8;
  string base = 9;
}
message EditReviewCommentRequest { string collection_id = 1; string id = 2; string body = 3; }
message DeleteReviewCommentRequest { string collection_id = 1; string id = 2; }
message SetReviewDispositionRequest {
  string collection_id = 1;
  repeated string ids = 2;
  string disposition = 3;
  // With "sent": the conversation whose message box received them.
  string session_id = 4;
  string session_title = 5;
}
message SetReviewAutoResolveRequest { string collection_id = 1; bool enabled = 2; }
message TurnCheckpointsRequest { string session_id = 1; }
// One repository's checkpoint at a point of the conversation.
message RepositoryCheckpoint {
  string member = 1;
  string commit = 2;
  string branch = 3;
  // Untracked files left out (too large, too many, nested repositories).
  repeated string skipped = 4;
  uint32 skipped_count = 5;
  // Why this repository could not be checkpointed; empty when it was.
  string error = 6;
}
message TurnCheckpoint {
  // 1-based, numbered across the whole conversation, resumes included.
  uint32 turn = 1;
  // The message that started the turn.
  string operation_id = 2;
  string prompt = 3;
  int64 started_at_unix_millis = 4;
  // 0 while the turn is running.
  int64 ended_at_unix_millis = 5;
  // What the turn changed, before → after, across repositories.
  uint32 files = 6;
  uint32 additions = 7;
  uint32 deletions = 8;
  repeated RepositoryCheckpoint before = 9;
}
message CodeRevert {
  string id = 1;
  // revert, or undo (of the revert named by undo_of).
  string kind = 2;
  // The turn whose start the files were reverted to.
  uint32 turn = 3;
  string undo_of = 4;
  // The undo that undid this revert; empty while it can still be undone.
  string undone_by = 5;
  int64 at_unix_millis = 6;
  // Files written or deleted.
  uint32 files = 7;
  // Files or repositories that could not be restored, said plainly.
  repeated string problems = 8;
}
message TurnCheckpoints {
  repeated TurnCheckpoint turns = 1;
  repeated CodeRevert reverts = 2;
  // A note for the agent waits for the next message.
  bool note_pending = 3;
}
message TurnChangesRequest { string session_id = 1; uint32 turn = 2; }
message TurnFile {
  string path = 1;
  string original_path = 2;
  // A added, M modified, D deleted, R renamed, T type changed.
  string status = 3;
  uint32 additions = 4;
  uint32 deletions = 5;
  bool binary = 6;
}
message TurnRepositoryChanges {
  string member = 1;
  repeated TurnFile files = 2;
  bool truncated = 3;
  string error = 4;
}
message TurnChanges {
  repeated TurnRepositoryChanges repositories = 1;
  // The turn is still running: its changes so far, against the files now.
  bool in_progress = 2;
}
message TurnDiffRequest {
  string session_id = 1; uint32 turn = 2; string member = 3; string path = 4;
  // A rename's source path.
  string original_path = 5;
}
message RevertCodeRequest { string session_id = 1; uint32 turn = 2; }
message RevertRepositoryPreview {
  string member = 1;
  // From the revert's side: A recreated, D deleted, M put back as it was.
  repeated TurnFile files = 2;
  bool truncated = 3;
  // Commits made since the checkpoint. They stay on the branch.
  uint32 commits_since = 4;
  string branch_then = 5;
  string branch_now = 6;
  // Why this repository will be left as it is.
  string error = 7;
}
message RevertCodePreview {
  repeated RevertRepositoryPreview repositories = 1;
  // Why the revert would be refused now (an agent is working); empty when it would not.
  string blocked = 2;
}
message UndoRevertCodeRequest { string session_id = 1; string revert_id = 2; }
// The workspace runtime (WORKSPACE_RUNTIME.md).
message WorkspaceRuntimeRequest { string collection_id = 1; }
// The workspace's port block: LAZYBOX_PORT_i is base + i, LAZYBOX_PORT is
// LAZYBOX_PORT_0 unless an action picks another port of the block.
message WorkspacePorts { uint32 base = 1; uint32 count = 2; }
// One repository's runtime configuration, as committed.
message WorkspaceScriptSource {
  // The workspace member (its folder) and its repository.
  string member = 1;
  string repository_id = 2;
  // ".lazybox/workspace.yaml" when the member has one, else "".
  string path = 3;
  // Why the file could not be used, with its line; nothing from it runs.
  string error = 4;
  // "none" (nothing committed), "approved", "required" (never approved) or
  // "changed" (differs from every version approved before).
  string approval = 5;
  // What ApproveWorkspaceScripts must name: the hash of what is shown.
  string hash = 6;
  // The file itself, for review.
  string content = 7;
  // Entries that differ from the last approved version: "setup", "archive",
  // "files", "env" or "action:<name>".
  repeated string changed = 8;
  // Settings > Workspaces adds or replaces entries for this repository.
  bool overridden = 9;
}
message WorkspaceRunState {
  // "idle", "running", "stopping", "succeeded", "failed" or "stopped".
  string state = 1;
  string command_id = 2;
  optional int32 exit_code = 3;
  string signal = 4;
  string error = 5;
  int64 started_at_unix_millis = 6;
  // The output's last line, for a status at a glance.
  string last_line = 7;
}
message WorkspaceAction {
  // "<member>/<name>": what Start/StopWorkspaceAction take.
  string key = 1;
  string member = 2;
  string name = 3;
  string run = 4;
  string cwd = 5;
  bool default = 6;
  // false: starting it stops the same action in every other workspace.
  bool concurrent = 7;
  // Where it serves, with LAZYBOX_PORT resolved; "" when it does not serve.
  string url = 8;
  // Its LAZYBOX_PORT; 0 when the workspace has no port block.
  uint32 port = 9;
  // "repository" (committed, needs approval) or "settings" (yours).
  string source = 10;
  // Why it cannot start now, e.g. its scripts await approval; "" when it can.
  string blocked = 11;
  WorkspaceRunState run_state = 12;
  // Other workspaces where this repository's action of the same name runs.
  repeated string running_elsewhere = 13;
}
message WorkspaceSetup {
  string member = 1;
  string run = 2;
  string source = 3;
  // The scripts await approval: setup has not run.
  bool pending_approval = 4;
  WorkspaceRunState run_state = 5;
  // Files copied from the source checkout into the worktree, and listed
  // files the source checkout does not have.
  repeated string copied_files = 6;
  repeated string missing_files = 7;
}
message WorkspaceRuntime {
  string collection_id = 1;
  WorkspacePorts ports = 2;
  // Why no port block could be allocated; actions still run without one.
  string ports_error = 3;
  repeated WorkspaceScriptSource sources = 4;
  repeated WorkspaceAction actions = 5;
  repeated WorkspaceSetup setups = 6;
  // The action Run starts: Settings first, then the first `default: true`,
  // then the first action.
  string default_action = 7;
}
message ApproveWorkspaceScriptsRequest {
  string collection_id = 1;
  string member = 2;
  // The hash the person reviewed; a file changed since is refused.
  string hash = 3;
  // Run the member's setup once approved, if it has not succeeded yet.
  bool run_setup = 4;
}
message WorkspaceActionRequest {
  string collection_id = 1;
  // WorkspaceAction.key.
  string action = 2;
  // Start: stop a running instance first. Ignored by Stop.
  bool restart = 3;
}
message StoppedElsewhere { string collection_id = 1; string workspace_name = 2; string action = 3; }
message WorkspaceActionResult {
  WorkspaceRuntime runtime = 1;
  // A non-concurrent action stopped in other workspaces to start here.
  repeated StoppedElsewhere stopped_elsewhere = 2;
}
message RunWorkspaceSetupRequest { string collection_id = 1; string member = 2; }
// Your own runtime settings, kept on this Runner and never committed.
message RepositoryRuntimeOverride {
  string repository_id = 1;
  // Shown name; ignored on save.
  string name = 2;
  // YAML in the same schema as .lazybox/workspace.yaml. Its entries add to or
  // replace the repository's, and run without approval: you wrote them.
  string config = 3;
  // The action Run starts in this repository's workspaces ("<name>").
  string default_action = 4;
  // Never run this repository's setup automatically.
  bool skip_setup = 5;
  // Why config was refused, on read.
  string error = 6;
}
message WorkspaceRuntimeSettings {
  uint64 revision = 1;
  // Port blocks are allocated in [port_range_start, port_range_end].
  uint32 port_range_start = 2;
  uint32 port_range_end = 3;
  repeated RepositoryRuntimeOverride repositories = 4;
}
message GetRemoteAccessRequest {}
message SetRemoteAccessRequest {
  // Serve the device gateway to this tailnet over HTTPS (never Funnel).
  bool tailscale = 1;
}
message RemoteAccess {
  // The device gateway on this machine (loopback only). Empty when it is not running.
  string local_url = 1;
  // What a phone opens: the gateway as another device reaches it. Empty while
  // no route reaches this Runner from another device.
  string phone_url = 2;
  TailscaleAccess tailscale = 3;
  // Why the gateway or the phone app is unavailable, if it is.
  string problem = 4;
}
message TailscaleAccess {
  // not_installed, not_running, needs_login, https_disabled, available,
  // serving, conflict (another service owns the HTTPS port), failed.
  string state = 1;
  // This machine's tailnet name, e.g. laptop.example.ts.net.
  string dns_name = 2;
  uint32 https_port = 3;
  // The owner turned the route on; it is restored when the Runner starts.
  bool enabled = 4;
  string detail = 5;
}
message BeginDevicePairingRequest {
  // read is always granted; respond and start are optional.
  repeated string grants = 1;
}
message DevicePairingRequest { string pairing_id = 1; }
message DevicePairing {
  string id = 1;
  // pending, paired, expired, cancelled, failed.
  string state = 2;
  // What the phone opens (the QR code). Only BeginDevicePairing returns it:
  // its fragment holds the one-time secret, which the Runner keeps only hashed.
  string url = 3;
  int64 expires_at_unix_millis = 4;
  repeated string grants = 5;
  // The device the offer paired.
  Device device = 6;
}
message Device {
  string id = 1;
  string name = 2;
  repeated string grants = 3;
  int64 paired_at_unix_millis = 4;
  int64 last_seen_at_unix_millis = 5;
  // A short digest of the device's key; the phone shows the same one.
  string fingerprint = 6;
}
message ListDevicesRequest {}
message ListDevicesResponse { repeated Device devices = 1; }
message RevokeDeviceRequest { string device_id = 1; }
// Missions. Statuses: ready, blocked, working, needs_you, changes_requested,
// claimed_done, done, failed, canceled (verifying is reserved). Trust:
// claimed (said so), observed (the Runner saw the exit status or process),
// verified (checks passed on the newest head), accepted (a person, at a gate).
message ListMissionsRequest {}
message ListMissionsResponse { repeated Mission missions = 1; }
message GetMissionRequest {
  string mission_id = 1;
  // Also refresh the pull requests of live attempts (at most once a minute per
  // repository); the result arrives as evidence on a later read.
  bool refresh_evidence = 2;
}
message CreateMissionRequest { string request_key = 1; string title = 2; string brief = 3; }
message UpdateMissionRequest {
  string mission_id = 1;
  // Idempotency: a retried change with the same id is not applied twice.
  string operation_id = 2;
  oneof change {
    MissionEdit edit = 3;
    MissionCancel cancel = 4;
    GoalCreate add_goal = 5;
    TaskCreate add_task = 6;
    TaskEdit edit_task = 7;
    TaskCancel cancel_task = 8;
    TaskAssign assign = 9;
    TaskReport report = 10;
    GateDecision accept = 11;
    GateDecision reject = 12;
  }
}
message MissionEdit { string title = 1; string brief = 2; }
message MissionCancel { string reason = 1; }
message GoalCreate { string title = 1; }
message TaskCreate { string goal_id = 1; string title = 2; string brief = 3; repeated string blocked_by = 4; }
message TaskEdit { string task_id = 1; string title = 2; string brief = 3; }
message TaskCancel { string task_id = 1; string reason = 2; }
message TaskAssign {
  string task_id = 1;
  // An existing conversation (any of its sessions), or open a new one.
  string session_id = 2;
  OpenSessionRequest open = 3;
  // Send the task's brief as the conversation's next message.
  bool send_brief = 4;
}
message TaskReport { string task_id = 1; string summary = 2; }
message GateDecision { string task_id = 1; string note = 2; }
message Mission {
  string id = 1; string title = 2; string brief = 3;
  string process = 4; string process_digest = 5; int32 autonomy = 6;
  int64 created_at_unix_millis = 7; int64 updated_at_unix_millis = 8;
  bool canceled = 9; uint64 seq = 10;
  repeated MissionGoal goals = 11;
  repeated MissionTask tasks = 12;
  // GetMission only: the log, newest first (at most 200).
  repeated MissionEvent events = 13;
  // The mission's log could not be read; it is listed, never written.
  string error = 14;
  // Events kept in the log that this Runner does not fold (unknown types or newer versions).
  uint32 ignored = 15;
  // UpdateMission: the change's result, e.g. the id of a created task.
  string created_id = 16;
  // UpdateMission with assign: the session the task went to.
  string session_id = 17;
}
message MissionGoal { string id = 1; string title = 2; }
message MissionTask {
  string id = 1; string goal_id = 2; string title = 3; string brief = 4;
  string status = 5;
  // What backs the status; empty where it claims nothing.
  string trust = 6;
  // What the recorded evidence alone supports.
  string evidence_trust = 7;
  // One sentence: why this status, and what backs it.
  string reason = 8;
  // stale, failing, ci_failing, no_evidence.
  repeated string flags = 9;
  // The human gate waiting for a decision (awaiting acceptance), or empty.
  string gate = 10;
  MissionAttempt attempt = 11;
  repeated MissionAttempt attempts = 12;
  // Newest first.
  repeated MissionEvidence evidence = 13;
  string report = 14; int64 reported_at_unix_millis = 15;
  // The note of the last decision at a gate.
  string decision_note = 16;
  repeated string blocked_by = 17;
  int64 created_at_unix_millis = 18; int64 updated_at_unix_millis = 19;
  // The snippet last sent to the current attempt's conversation, and what it chains to.
  string last_snippet = 20; repeated string next_snippets = 21;
}
message MissionAttempt {
  string id = 1; string conversation_id = 2;
  // The conversation's latest session, to open it.
  string session_id = 3;
  string collection_id = 4;
  int64 started_at_unix_millis = 5; int64 ended_at_unix_millis = 6;
  // deleted, handoff or stopped, once ended.
  string outcome = 7;
  // running, waiting, idle, closed or missing.
  string live = 8;
  string live_detail = 9;
  string title = 10;
}
message MissionEvidence {
  string ref = 1;
  // run, commit or pr.
  string kind = 2;
  string title = 3;
  // pass, fail, pending or unknown.
  string outcome = 4;
  optional int32 exit_code = 5;
  bool piped = 6;
  string member = 7; string repository = 8; string head = 9;
  int64 number = 10; string url = 11; string state = 12;
  string collection_id = 13; string session_id = 14; string command_id = 15;
  string output_path = 16; string detail = 17;
  int64 at_unix_millis = 18;
}
message MissionEvent {
  uint64 seq = 1; int64 at_unix_millis = 2; string type = 3; uint32 version = 4;
  string subject = 5; string actor_kind = 6; string actor_role = 7; string conversation_id = 8;
  string summary = 9;
  // This Runner folds it; otherwise it is kept and shown raw.
  bool known = 10;
  repeated string evidence = 11;
  string raw_json = 12;
}
message ListPromptHistoryRequest {
  // Scope: one conversation, one workspace, or (both empty) every conversation.
  string conversation_id = 1;
  string collection_id = 2;
  string search = 3;
  uint32 limit = 4;
}
message PromptRecord {
  string text = 1; string conversation_id = 2; string collection_id = 3; string session_id = 4;
  int64 at_unix_millis = 5;
  PromptSource source = 6;
}
message PromptHistory {
  repeated PromptRecord prompts = 1;
  // With conversation_id: the snippet last sent there and the chain it offers.
  string last_snippet = 2;
  repeated string next_snippets = 3;
  // With collection_id: the workspace's last distinct snippets, newest first.
  repeated string recent_snippets = 4;
}
// Who wrote one version of an artifact.
message ArtifactAuthor {
  // "person" (the owner, from the app), "agent" (an execution's credential,
  // `lazybox artifact put`) or "file" (the tracked file changed on disk, by
  // whoever changed it).
  string kind = 1;
  // The execution, for an agent.
  string session_id = 2;
}
// Where one version's content came from.
message ArtifactSource {
  // "message" (a conversation message), "file" (a workspace file), "agent"
  // (published by an agent) or "edit" (written in the app).
  string kind = 1;
  // A message: the execution and its conversation, the message's journal
  // cursor and turn.
  string session_id = 2;
  string conversation_id = 3;
  string message_id = 4;
  string turn_id = 5;
  // A file: its workspace path ("member/path").
  string path = 6;
}
// A reference from an artifact to work it belongs to. Reserved for missions
// and tasks (ORCHESTRATION.md, slice 1): until the Runner has them, a link of
// any kind is refused.
message ArtifactLink {
  // "mission" or "task".
  string kind = 1;
  string id = 2;
  // "brief" or "evidence".
  string role = 3;
}
message ArtifactVersion {
  uint32 number = 1;
  int64 created_at_unix_millis = 2;
  ArtifactAuthor author = 3;
  ArtifactSource source = 4;
  // sha256 of the content, hex.
  string digest = 5;
  uint64 size = 6;
}
message Artifact {
  string id = 1;
  string collection_id = 2;
  string title = 3;
  // plan, report, spec, notes or other.
  string kind = 4;
  // markdown (mermaid fences render as diagrams).
  string format = 5;
  int64 created_at_unix_millis = 6;
  int64 updated_at_unix_millis = 7;
  // Every version, oldest first (headers only).
  repeated ArtifactVersion versions = 8;
  // The requested version's content (GetArtifact, PutArtifact); empty in lists.
  string content = 9;
  // The version content belongs to.
  uint32 content_version = 10;
  // The conversation the artifact was first taken from, if any: "Update from
  // this message" is offered on that conversation's later messages.
  string origin_session_id = 11;
  string origin_conversation_id = 12;
  // The workspace file the Runner follows, if any ("member/path").
  string tracked_path = 13;
  // Why the tracked file could not be followed lately (removed, too large,
  // not text); empty while it is followed.
  string tracking_problem = 14;
  repeated ArtifactLink links = 15;
}
message ListArtifactsRequest { string collection_id = 1; }
message ListArtifactsResponse { repeated Artifact artifacts = 1; }
message GetArtifactRequest {
  string collection_id = 1;
  string artifact_id = 2;
  // 0 is the latest version.
  uint32 version = 3;
}
message PutArtifactRequest {
  string collection_id = 1;
  // Empty creates an artifact; otherwise a version is added to this one.
  string artifact_id = 2;
  // Required to create; on an update, empty keeps the title.
  string title = 3;
  // Empty is "other" on create, and keeps the kind on an update.
  string kind = 4;
  string content = 5;
  // Ignored for an agent credential (its source is always its own execution).
  ArtifactSource source = 6;
  // On an update: the version the writer saw. The Runner refuses the write if
  // a newer version exists, so a reviewed diff is the diff that is saved. 0
  // skips the check.
  uint32 expected_version = 7;
  repeated ArtifactLink links = 8;
}
message TrackArtifactFileRequest {
  string collection_id = 1;
  // Workspace path ("member/path").
  string path = 2;
  // Empty takes the file's first heading, else its name.
  string title = 3;
  string kind = 4;
}
message UpdateArtifactRequest {
  string collection_id = 1;
  string artifact_id = 2;
  // Empty keeps the title; likewise kind.
  string title = 3;
  string kind = 4;
  // Stop recording versions from the tracked file; its versions are kept.
  bool stop_tracking = 5;
}
message DeleteArtifactRequest { string collection_id = 1; string artifact_id = 2; }
message DeleteArtifactResponse {}
message SaveArtifactToRepositoryRequest {
  string collection_id = 1;
  string artifact_id = 2;
  // Workspace path ("member/path") of a Markdown file.
  string path = 3;
  // Replacing an existing file requires the version the person saw
  // (WorkspaceFile.version); empty only creates a new file.
  string expected_file_version = 4;
  // Then follow that file: later edits on disk become versions.
  bool track = 5;
}
message SaveArtifactToRepositoryResponse {
  string path = 1;
  Artifact artifact = 2;
}
message CreateArtifactIssueRequest {
  string collection_id = 1;
  string artifact_id = 2;
  // The workspace repository whose GitHub project receives the issue.
  string member = 3;
  // Empty is the artifact's title.
  string title = 4;
}
message CreateArtifactIssueResponse {
  int64 number = 1;
  string url = 2;
}

// Power-user extensibility (POWER.md): the actions and hooks file.
message GetUserActionsRequest {}
message UserActions {
  // The file the Runner reads, and whether it exists.
  string path = 1;
  bool exists = 2;
  // The file as a whole could not be read (YAML syntax, say). The actions and
  // hooks below are then the last version that loaded, if any (stale).
  string error = 3;
  // Problems with single entries; an entry with an error is left out.
  repeated UserActionIssue issues = 4;
  repeated UserAction actions = 5;
  repeated UserHook hooks = 6;
  // Increases whenever what the file declares changes.
  uint64 revision = 7;
  int64 loaded_at_unix_millis = 8;
  // The JSON Schema of the file, and where InitUserActions writes it.
  string schema = 9;
  string schema_path = 10;
  // The events hooks may follow, for Settings and completions.
  repeated string events = 11;
  // The actions and hooks above come from an earlier version of the file,
  // because the current one does not load.
  bool stale = 12;
}
message UserActionIssue {
  // Where in the file: "actions[2].steps[0]", say.
  string path = 1;
  uint32 line = 2;
  string message = 3;
  // "error" leaves the entry out; "warning" keeps it.
  string severity = 4;
}
message UserAction {
  string id = 1;
  string title = 2;
  string description = 3;
  string icon = 4;
  // One key after the leader (]] t), or empty.
  string key = 5;
  // Where the action is offered: palette, menu (the ]] which-key menu),
  // conversation (its menu) and workspace (its row's menu).
  repeated string where = 6;
  repeated UserActionStep steps = 7;
  // Ask before running.
  bool confirm = 8;
}
message UserActionStep {
  // send, open, run, command, permission or wait.
  string kind = 1;
  string name = 2;
  // always (default), succeeded or failed: whether the step runs, from the
  // result of the last step before it that has no condition.
  string when = 3;
  // send: the text, or a snippet's key; to: current (default), new, or a
  // conversation's id or title; wait: also wait for the turn to end.
  string text = 4;
  string snippet = 5;
  string to = 6;
  bool wait = 7;
  // open: a panel kind, a web URL, or a workspace file and line.
  string panel = 8;
  string url = 9;
  string file = 10;
  uint32 line = 11;
  // run: a workspace action's key (its scripts' approval applies).
  string action = 12;
  // command: a shell command run as a managed command of the conversation.
  string command = 13;
  // permission: ask, read-only or yolo.
  string permission = 14;
  // wait: idle or needs-input.
  string until = 15;
  uint32 timeout_seconds = 16;
}
message UserHook {
  string id = 1;
  string description = 2;
  repeated string on = 3;
  // Filters: every one set must match. Workspace and conversation match the
  // name or title, with * as a wildcard; repository matches owner/name.
  repeated string workspaces = 4;
  repeated string conversations = 5;
  repeated string repositories = 6;
  // Exactly one of: a program and its arguments, a shell line, a webhook.
  repeated string run = 7;
  string shell = 8;
  string webhook = 9;
  map<string, string> headers = 10;
  // Credential grants for the hook's own `lazybox` calls: read, respond,
  // start. Without grants a hook holds no Runner credential at all.
  repeated string grants = 11;
  uint32 timeout_seconds = 12;
  bool enabled = 13;
}
message ListHookRunsRequest { uint32 limit = 1; }
message HookRuns { repeated HookRun runs = 1; }
message HookRun {
  string id = 1;
  string hook_id = 2;
  string event = 3;
  // running, succeeded, failed or skipped.
  string state = 4;
  // The managed command holding the run's output (ReadCommand).
  string command_id = 5;
  optional int32 exit_code = 6;
  string error = 7;
  // One line about the event: "Alpha feature · fix the tests needs input".
  string summary = 8;
  string collection_id = 9;
  string session_id = 10;
  int64 started_at_unix_millis = 11;
  int64 ended_at_unix_millis = 12;
  // A webhook's HTTP status.
  uint32 http_status = 13;
  repeated string grants = 14;
  bool test = 15;
}
message TestHookRequest { string hook_id = 1; }
message UiRequest {
  string id = 1;
  // open, shot or action.
  string kind = 2;
  // open and action: a workspace, a conversation, or a workspace file and line.
  string collection_id = 3;
  string session_id = 4;
  string file = 5;
  uint32 line = 6;
  // shot: empty for the window, or a panel kind; open: a panel to show.
  string panel = 7;
  // action: the user action's id.
  string action_id = 8;
  // pending, done or failed.
  string state = 9;
  string error = 10;
  // shot: the PNG.
  bytes png = 11;
  // What the window did, in one line ("Showed Alpha feature · fix the tests").
  string detail = 12;
  int64 created_at_unix_millis = 13;
}
message WaitUiRequestRequest {
  string id = 1;
  // Bounded by the Runner to two minutes; zero selects 30 seconds.
  uint32 timeout_ms = 2;
}
message WatchUiRequestsRequest {
  // "desktop" or "web": a desktop window is preferred when both are open.
  string surface = 1;
}
message CompleteUiRequestRequest {
  string id = 1;
  string error = 2;
  bytes png = 3;
  string detail = 4;
}

// One repository of a workspace, as an agent sees it.
message WorkspaceRepository {
  // The worktree's folder name in the workspace.
  string name = 1;
  string path = 2;
  string branch = 3;
  // The catalog identity (github:owner/repo, or a local one).
  string identity = 4;
  bool ready = 5;
}
message ListWorkspaceRepositoriesRequest { string collection_id = 1; }
message WorkspaceRepositories {
  string collection_id = 1;
  string name = 2;
  // The branch a repository added to this workspace gets.
  string branch = 3;
  repeated WorkspaceRepository repositories = 4;
  // Requests agents made in this workspace that are still waiting.
  repeated RepositoryRequest requests = 5;
}
// A catalog repository that matches what an agent asked for, best first.
message RepositoryCandidate {
  // Empty for a local git folder not in the catalog yet (local_path names it).
  string identity = 1;
  string name = 2;
  // workspace, registered, local, github or folder.
  string source = 3;
  string local_path = 4;
  int32 score = 5;
}
message RequestRepositoryRequest {
  // The asking execution; an agent may only name its own.
  string session_id = 1;
  // A name, owner/repo, GitHub URL or absolute local path.
  string query = 2;
  string reason = 3;
}
message RepositoryRequest {
  string id = 1;
  string session_id = 2;
  string conversation_id = 3;
  string collection_id = 4;
  string query = 5;
  string reason = 6;
  repeated RepositoryCandidate candidates = 7;
  // pending, added, declined or expired.
  string state = 8;
  // The branch the repository gets in this workspace.
  string branch = 9;
  // declined: the person's reason, if they gave one.
  string decline_reason = 10;
  // added: the new worktrees.
  repeated WorkspaceRepository added = 11;
  int64 created_at_unix_millis = 12;
  int64 expires_at_unix_millis = 13;
  int64 resolved_at_unix_millis = 14;
  // The repository was already in the workspace: nothing was asked.
  bool already = 15;
}
message WaitRepositoryRequestRequest {
  string request_id = 1;
  // At most 60; 0 returns at once.
  uint32 timeout_seconds = 2;
}
message DeclineRepositoryRequestRequest {
  string request_id = 1;
  string reason = 2;
}

// One conversation's agent browser (BROWSER.md).
message BrowserState {
  string conversation_id = 1;
  // The execution that drives it now (the conversation's latest).
  string session_id = 2;
  string collection_id = 3;
  // closed | starting | open | stopped | failed
  string status = 4;
  // Who holds it: agent | person (after Take over).
  string controller = 5;
  string url = 6;
  string title = 7;
  bool loading = 8;
  bool can_go_back = 9;
  bool can_go_forward = 10;
  // The agent opens any site without asking, in this conversation.
  bool browse_freely = 11;
  // Why it failed or was stopped, in words for the person.
  string problem = 12;
  // The agent's action in progress, if any.
  BrowserAction current = 13;
  uint32 viewport_width = 14;
  uint32 viewport_height = 15;
  int64 updated_at_unix_millis = 16;
  // "Claude" or "Codex": who browses.
  string agent_name = 17;
  // A site, download or sign-in request waits for the person.
  bool waiting = 18;
}
// One step in a browser's action log.
message BrowserAction {
  uint64 seq = 1;
  // open | navigate | snapshot | click | type | select | press | scroll |
  // screenshot | back | forward | wait | close | blocked | download |
  // take_over | give_back | stop | site
  string kind = 2;
  // agent | person | lazybox
  string actor = 3;
  // One readable line: Clicked button "Sign in".
  string summary = 4;
  string url = 5;
  // Where it happened, in the page's CSS pixels; absent when nowhere.
  BrowserBox box = 6;
  // running | done | failed | blocked
  string status = 7;
  string error = 8;
  int64 at_unix_millis = 9;
  uint32 duration_ms = 10;
}
message BrowserBox {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}
// One screencast frame: a JPEG of the page's viewport.
message BrowserFrame {
  bytes jpeg = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint64 seq = 4;
}
message WatchBrowserRequest {
  // Any execution of the conversation; the browser belongs to the conversation.
  string session_id = 1;
}
message BrowserEvent {
  BrowserState state = 1;
  BrowserFrame frame = 2;
  BrowserAction action = 3;
  // First event only: the recent action log, oldest first.
  repeated BrowserAction history = 4;
}
message ControlBrowserRequest {
  string session_id = 1;
  // take_over | give_back | stop | resume | browse_freely | ask_sites |
  // navigate | back | forward | reload (the last four only while the person holds it)
  string action = 2;
  string url = 3;
}
message BrowserInputRequest {
  string session_id = 1;
  // mouse_move | mouse_down | mouse_up | wheel | key_down | key_up | text
  string type = 2;
  // Page CSS pixels.
  double x = 3;
  double y = 4;
  // left | middle | right
  string button = 5;
  uint32 click_count = 6;
  double delta_x = 7;
  double delta_y = 8;
  // A KeyboardEvent.key value: "Enter", "a", "ArrowLeft".
  string key = 9;
  string text = 10;
  // Alt=1, Control=2, Meta=4, Shift=8.
  uint32 modifiers = 11;
}
// A request the agent's browsing raised, waiting for the person. It is a
// session's pending entry of type "browser_request" whose provider data is
// this message.
message BrowserRequest {
  string id = 1;
  string session_id = 2;
  string conversation_id = 3;
  string collection_id = 4;
  // site (first visit to an origin) | download | sign_in (a form with a password)
  string kind = 5;
  string url = 6;
  string origin = 7;
  // The agent's reason, when it gave one.
  string reason = 8;
  string file_name = 9;
  int64 created_at_unix_millis = 10;
  // The conversation's permission mode when asked ("yolo" still asks for sites).
  string permission = 11;
  string agent_name = 12;
}
message DecideBrowserRequestRequest {
  string request_id = 1;
  // site: once | conversation | workspace | deny. download, sign_in: once | deny.
  string decision = 2;
  // Told to the agent with a deny.
  string reason = 3;
}
message BrowserWorkspaceSites {
  string collection_id = 1;
  string name = 2;
  // Sites always allowed in this workspace ("Always for this workspace").
  repeated string sites = 3;
  // The workspace has a browser profile on disk (cookies, storage, cache).
  bool has_data = 4;
  int64 data_bytes = 5;
}
message BrowserSettings {
  uint64 revision = 1;
  // ask (each new site asks) | allow (any site, no asking) | off (no agent browser)
  string default_permission = 2;
  // Sites any agent opens without asking: example.com, *.example.com.
  repeated string allowed_sites = 3;
  // ask | block
  string downloads = 4;
  // Show the agent browser beside the chat when an agent starts browsing.
  bool show_panel = 5;
  repeated BrowserWorkspaceSites workspaces = 6;
  // Why agents cannot browse on this Runner, if they cannot.
  string problem = 7;
}
message ClearBrowserDataRequest {
  string collection_id = 1;
}
